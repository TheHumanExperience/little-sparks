name: Game or content idea
description: A new game, puzzle tweak, photo, story or word idea.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Keep it cosy — no timers, exam language or pressure (see PRODUCT.md and CONTENT.md).
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would she see and do? Which level(s)?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would be a nice spark
