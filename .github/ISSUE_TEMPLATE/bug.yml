name: Bug
description: Something looks wrong, breaks, or loses progress.
labels: ["bug"]
body:
  - type: input
    id: game
    attributes:
      label: Game or area
      description: Card name (e.g. Garden Beds), or header, sheets, leaderboard, saving…
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level
      options: [Gentle, Medium, Tricky, All / not level-specific]
    validations:
      required: true
  - type: input
    id: day
    attributes:
      label: Puzzle day
      description: Date of the puzzle (today or an archive day), YYYY-MM-DD.
      placeholder: "2026-11-24"
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, iOS Safari 19
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce if you know them. Screenshots welcome.
    validations:
      required: true
  - type: checkboxes
    id: progress
    attributes:
      label: Saved progress
      options:
        - label: Progress, streaks or rewards were lost or changed
