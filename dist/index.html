<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6ef" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%B3%3C/text%3E%3C/svg%3E" />
    <title>Little Sparks — Your daily puzzle ritual</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="feedmode">
    <header class="feedbar">
      <a class="brand" href="#" aria-label="Little Sparks, back to the top of today"><span>✳</span> little sparks</a>
      <div class="pills">
        <button class="pill" id="todayPill" type="button" aria-label="Jump to a day"><span class="todaylabel">Today · </span><b id="todayCount">0/17</b></button>
        <button class="pill soundpill" id="soundPill" type="button" aria-pressed="true" aria-label="Sound on. Turn chimes off"><span aria-hidden="true">🔔</span></button>
        <button class="pill" id="levelPill" type="button" aria-label="Change difficulty">Medium</button>
      </div>
      <div id="flowBar" class="flowbar" role="meter" aria-label="Flow: solve without hints to fill it" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><i></i></div>
    </header>
    <main id="feed" aria-label="Puzzle feed"></main>
    <p id="announce" class="visually-hidden" aria-live="polite"></p>
    <dialog id="levelSheet" class="sheet">
      <div class="modalhead"><h2>Make it your kind of day</h2><button class="quiet" data-close aria-label="Close">✕</button></div>
      <section class="difficultybar" aria-label="Puzzle difficulty">
        <div class="difficultyheading"><label for="difficulty">Difficulty</label><strong id="difficultyName">Medium</strong></div>
        <input id="difficulty" type="range" min="0" max="2" step="1" value="1" aria-describedby="difficultyHelp" />
        <div class="rangeends"><span>Gentle</span><span>Medium</span><span>Tricky</span></div>
        <p id="difficultyHelp"></p>
      </section>
    </dialog>
    <dialog id="daysSheet" class="sheet">
      <div class="modalhead"><h2>A little look back</h2><button class="quiet" data-close aria-label="Close">✕</button></div>
      <p>Today and the previous 30 days, at your own pace.</p>
      <div id="days"></div>
    </dialog>
    <script src="valid-words.js"></script>
    <script src="app.js"></script>
    <script src="daily-content.js"></script>
    <script src="photos.js"></script>
    <script src="extras.js"></script>
    <script src="constellations.js"></script>
    <script src="stories.js"></script>
    <script src="ladders.js"></script>
    <script src="sparks.js"></script>
    <script src="feed.js"></script>
  </body>
</html>
